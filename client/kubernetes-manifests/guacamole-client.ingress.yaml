apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: guacamole-client-ingress
    namespace: guacamole
    annotations:
        kubernetes.io/ingress.global-static-ip-name: guacamole-external-europe
        networking.gke.io/managed-certificates: guacamole-client-cert
spec:
    defaultBackend:
        service:
          name: guacamole-client-service
          port:
            number: 80
